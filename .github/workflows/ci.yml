name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api
          composer-options: --prefer-dist --no-interaction
      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run API tests
        run: php artisan test
      - name: Check API formatting
        run: ./vendor/bin/pint --test

  api-postgres:
    name: API (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cue_cards_test
          POSTGRES_USER: cue_cards
          POSTGRES_PASSWORD: cue_cards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cue_cards -d cue_cards_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_pgsql
          tools: composer:v2
      - uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api
          composer-options: --prefer-dist --no-interaction
      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run API tests on PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: cue_cards_test
          DB_USERNAME: cue_cards
          DB_PASSWORD: cue_cards_test
        run: php artisan test

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Check generated OpenAPI types
        run: |
          npm run contract:generate
          git diff --exit-code -- src/infrastructure/api/generated/schema.ts
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run build

  mobile-e2e:
    name: Mobile E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure() || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
          if-no-files-found: ignore

  android-debug:
    name: Android debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npm run cap:sync
      - name: Run Android unit tests and assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew testDebugUnitTest assembleDebug
      - if: failure() || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/android/**/build/reports/tests
          if-no-files-found: ignore

  deploy-api:
    name: Deploy API
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.APP_DIR }}"
            API_DIR="$APP_DIR/apps/api"
            API_BASE_URL="${{ vars.API_BASE_URL }}"

            if [ -z "$APP_DIR" ] || [ -z "$API_BASE_URL" ]; then
              echo 'APP_DIR and API_BASE_URL are required.' >&2
              exit 1
            fi

            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR"

            maintenance_active=0
            restore_application() {
              exit_code=$?
              if [ "$maintenance_active" -eq 1 ] && [ -f "$API_DIR/artisan" ]; then
                (cd "$API_DIR" && /usr/bin/php8.3 artisan up --no-interaction) || true
              fi
              exit "$exit_code"
            }
            trap restore_application EXIT HUP INT TERM

            if [ -f "$API_DIR/vendor/autoload.php" ]; then
              cd "$API_DIR"
              /usr/bin/php8.3 artisan down --retry=60 --no-interaction
              maintenance_active=1
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            cd "$API_DIR"
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
            /usr/bin/php8.3 artisan config:clear --no-interaction
            /usr/bin/php8.3 artisan migrate --force --no-interaction
            /usr/bin/php8.3 artisan config:cache --no-interaction
            /usr/bin/php8.3 artisan route:cache --no-interaction
            /usr/bin/php8.3 artisan view:cache --no-interaction
            /usr/bin/php8.3 artisan event:cache --no-interaction
            /usr/bin/php8.3 artisan queue:restart --no-interaction

            chown -R root:www-data "$APP_DIR"
            find "$APP_DIR" -type d -exec chmod 0750 {} +
            find "$APP_DIR" -type f ! -perm /111 -exec chmod 0640 {} +
            find "$APP_DIR" -type f -perm /111 -exec chmod 0750 {} +
            chown -R www-data:www-data "$API_DIR/storage" "$API_DIR/bootstrap/cache"
            find "$API_DIR/storage" "$API_DIR/bootstrap/cache" -type d -exec chmod 0770 {} +
            find "$API_DIR/storage" "$API_DIR/bootstrap/cache" -type f -exec chmod 0660 {} +

            systemctl restart php8.3-fpm
            supervisorctl restart cue-cards-ai-worker
            nginx -t

            /usr/bin/php8.3 artisan up --no-interaction
            maintenance_active=0
            trap - EXIT HUP INT TERM

            systemctl reload nginx
            curl --fail --silent --show-error --max-time 20 "$API_BASE_URL/up" >/dev/null
