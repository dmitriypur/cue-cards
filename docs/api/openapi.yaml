openapi: 3.0.3
info:
  title: Cue Cards API
  version: 1.0.0
  description: Versioned API contract for the Cue Cards Android MVP.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                data:
                  access_token: 1|synthetic-token
                  token_type: Bearer
                  user:
                    id: 0198a70d-4f72-70ad-bb3f-35b64f6ee1b2
                    name: Владелец
                    email: owner@example.test
                    role: superadmin
                    entitlements:
                      - offline_scripts
                      - offline_recording
                      - cloud_sync
                      - ai_cues
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Current access token revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/me:
    get:
      operationId: me
      responses:
        '200':
          description: Current user identity and entitlements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                data:
                  id: 0198a70d-4f72-70ad-bb3f-35b64f6ee1b2
                  name: Владелец
                  email: owner@example.test
                  role: superadmin
                  entitlements:
                    - offline_scripts
                    - offline_recording
                    - cloud_sync
                    - ai_cues
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/scripts/{script}:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
    get:
      operationId: getScript
      responses:
        '200':
          description: Active script aggregate owned by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'
              example:
                data:
                  id: 0198a70d-a717-70ae-a41d-905a2237bd18
                  title: Синтетический сценарий
                  source_format: markdown
                  source_text: "# Синтетический сценарий\n\n## Хук\n\nКороткий исходный текст."
                  import_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  status: ready
                  version: 3
                  last_opened_at: '2026-08-06T12:00:00+00:00'
                  updated_at: '2026-08-06T12:05:00+00:00'
                  cards:
                    - id: 0198a70e-23a2-73df-8387-34636552833a
                      script_id: 0198a70d-a717-70ae-a41d-905a2237bd18
                      position: 0
                      title: Хук
                      full_text: Короткий исходный текст.
                      content_hash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                      version: 2
                      cue_set:
                        id: 0198a70e-5670-704a-86bb-ced23df0704f
                        card_id: 0198a70e-23a2-73df-8387-34636552833a
                        cues:
                          - Обозначить проблему
                          - Дать обещание
                          - Перейти к сути
                        source_hash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                        status: ready
                        generation_id: 0198a70e-95b2-7642-a06f-aa4a42f0492a
                        manually_edited: false
                        version: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/sync:
    get:
      operationId: getSyncChanges
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Cursor-ordered changes for the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/sync/commands:
    post:
      operationId: submitSyncCommands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
      responses:
        '200':
          description: Commands accepted or recognized as idempotent retries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/SyncConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/scripts/{script}/cue-generations:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
    post:
      operationId: startScriptCueGeneration
      responses:
        '202':
          description: Script cue generation queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGenerationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/cards/{card}/cue-generations:
    parameters:
      - $ref: '#/components/parameters/CardId'
    post:
      operationId: startCardCueGeneration
      responses:
        '202':
          description: Card cue generation queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGenerationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/ai-generations/{generation}:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
    get:
      operationId: getAiGeneration
      responses:
        '200':
          description: Current generation status and safe failure details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGenerationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    ScriptId:
      name: script
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardId:
      name: card
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GenerationId:
      name: generation
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Authentication is missing, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource is absent or hidden by ownership policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Current state prevents the requested operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SyncConflict:
      description: Submitted base version differs from the current server version.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SyncConflictResponse'
    ValidationFailed:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    RateLimited:
      description: A technical request-rate safeguard was reached.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, device_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_name:
          type: string
          maxLength: 255
    LoginResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [access_token, token_type, user]
          properties:
            access_token:
              type: string
            token_type:
              type: string
              enum: [Bearer]
            user:
              $ref: '#/components/schemas/User'
    UserResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    User:
      type: object
      additionalProperties: false
      required: [id, name, email, role, entitlements]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [superadmin, user]
        entitlements:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [offline_scripts, offline_recording, cloud_sync, ai_cues]
    ScriptResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ScriptSnapshot'
    ScriptSnapshot:
      type: object
      additionalProperties: false
      required: [id, title, source_format, source_text, import_hash, status, version, updated_at, cards]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        source_format:
          type: string
          enum: [markdown, text]
        source_text:
          type: string
        import_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        status:
          type: string
          enum: [draft, ready, archived]
        version:
          type: integer
          minimum: 0
        last_opened_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        cards:
          type: array
          items:
            $ref: '#/components/schemas/CardSnapshot'
    CardSnapshot:
      type: object
      additionalProperties: false
      required: [id, script_id, position, title, full_text, content_hash, version, cue_set]
      properties:
        id:
          type: string
          format: uuid
        script_id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        title:
          type: string
        full_text:
          type: string
        content_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        version:
          type: integer
          minimum: 0
        deleted_at:
          type: string
          format: date-time
          nullable: true
        cue_set:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CueSetSnapshot'
    CueSetSnapshot:
      type: object
      additionalProperties: false
      required: [id, card_id, cues, source_hash, status, generation_id, manually_edited, version]
      properties:
        id:
          type: string
          format: uuid
        card_id:
          type: string
          format: uuid
        cues:
          type: array
          minItems: 0
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 200
        source_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          nullable: true
        status:
          type: string
          enum: [missing, pending, generating, ready, stale, failed]
        generation_id:
          type: string
          format: uuid
          nullable: true
        manually_edited:
          type: boolean
        version:
          type: integer
          minimum: 0
    SyncBatchRequest:
      type: object
      additionalProperties: false
      required: [commands]
      properties:
        commands:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/SyncCommand'
    SyncCommand:
      type: object
      additionalProperties: false
      required: [operation_id, aggregate_id, type, base_version, payload, created_at]
      properties:
        operation_id:
          type: string
          format: uuid
        aggregate_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [script.replace]
        base_version:
          type: integer
          minimum: 0
        payload:
          $ref: '#/components/schemas/ScriptSnapshot'
        created_at:
          type: string
          format: date-time
    SyncBatchResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [results]
          properties:
            results:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [operation_id, aggregate_id, version, duplicate]
                properties:
                  operation_id:
                    type: string
                    format: uuid
                  aggregate_id:
                    type: string
                    format: uuid
                  version:
                    type: integer
                    minimum: 1
                  duplicate:
                    type: boolean
    SyncPageResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [changes, next_cursor, has_more]
          properties:
            changes:
              type: array
              items:
                $ref: '#/components/schemas/SyncChange'
            next_cursor:
              type: integer
              minimum: 0
            has_more:
              type: boolean
    SyncChange:
      type: object
      additionalProperties: false
      required: [cursor, aggregate_id, version, type, snapshot]
      properties:
        cursor:
          type: integer
          minimum: 1
        aggregate_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        type:
          type: string
          enum: [script.replace]
        snapshot:
          $ref: '#/components/schemas/ScriptSnapshot'
    AiGenerationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AiGeneration'
    AiGeneration:
      type: object
      additionalProperties: false
      required: [id, script_id, card_id, status, completed_cards, total_cards, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        script_id:
          type: string
          format: uuid
        card_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [queued, running, completed, failed]
        completed_cards:
          type: integer
          minimum: 0
        total_cards:
          type: integer
          minimum: 1
        error:
          $ref: '#/components/schemas/PublicError'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/PublicError'
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlation_id, fields]
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED]
            message:
              type: string
            correlation_id:
              type: string
              format: uuid
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    SyncConflictResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlation_id, conflict]
          properties:
            code:
              type: string
              enum: [SYNC_VERSION_CONFLICT]
            message:
              type: string
            correlation_id:
              type: string
              format: uuid
            conflict:
              type: object
              additionalProperties: false
              required: [aggregate_id, local, server]
              properties:
                aggregate_id:
                  type: string
                  format: uuid
                local:
                  $ref: '#/components/schemas/ScriptSnapshot'
                server:
                  $ref: '#/components/schemas/ScriptSnapshot'
    PublicError:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id]
      properties:
        code:
          type: string
        message:
          type: string
        correlation_id:
          type: string
          format: uuid
